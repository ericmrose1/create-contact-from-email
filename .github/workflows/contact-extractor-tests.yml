name: Contact extractor regression
on:
  pull_request:
  push:
    branches:
      - "fix/**"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test production contact parser
        run: node --test tests/contact-extractor.test.cjs
